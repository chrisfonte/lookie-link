_meta:
  schema: lookie-link-plan-v1
  title: User-Defined Forms Platform
  created: 2026-07-15
  updated: 2026-07-15
  version: 0.2.0
  status: review_complete
  owner: Lookie-Link Project
  document: ./plan.md
  changelog: ./CHANGELOG.md

objective: >-
  Deliver a file-native, API-first forms platform in which authorized users and
  agents define versioned reusable templates, Lookie-Link renders first-party
  forms, submissions become durable sovereign records, and optional reactions
  run only after capture succeeds.

review:
  required: true
  reviewer: fable
  brief: ./review-brief-fable.md
  report: ./review-fable.md
  status: complete
  verdict: approve_with_required_changes
  blocking_findings: [B1-raw-origin-isolation, B2-fsync-durability, B3-submit-only-receipt-access, B4-pilot-and-static-option-resequencing, B5-deletion-contract-in-93]
  implementation_ready: false

decisions:
  - id: AD-1
    status: proposed
    decision: Stable generic endpoints; no generated server code per form.
  - id: AD-2
    status: proposed
    decision: Lookie-Link renders first-party forms from declarative definitions.
  - id: AD-3
    status: proposed
    decision: Files are canonical and portable; API is the preferred mutation path.
  - id: AD-4
    status: proposed
    decision: Templates, immutable template versions, and form instances are separate resources.
  - id: AD-5
    status: proposed
    decision: Each submission is one immutable JSON file; SQLite is rebuildable support state only.
  - id: AD-6
    status: proposed
    decision: Server receipt time and user-supplied event time are separate fields.
  - id: AD-7
    status: proposed
    decision: Persist first; dispatch optional reactions from a durable outbox afterward.
  - id: AD-8
    status: proposed
    decision: Definitions select logical approved bindings, never arbitrary paths or commands.
  - id: AD-9
    status: proposed
    decision: Raw HTML receives no implicit forms privileges; mutations require permission and CSRF controls.
  - id: AD-10
    status: proposed
    decision: Stabilize schema and API before visual or conversational builders.
  - id: AD-11
    status: proposed
    decision: Mount forms through dedicated modules and extract narrow shared primitives instead of growing monolith files.

