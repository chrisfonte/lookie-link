open_decisions:
  - constrained field grammar versus restricted JSON Schema subset
  - repeatable groups in v1 versus follow-up
  - minimal principal contract before browser accounts
  - mounted-root-only launch versus managed-repo adapter integration
  - correction, deletion, and retention event semantics
  - direct submission imports and server attestation boundary
  - audit redaction contract
  - CSRF policy in unrestricted private-network mode
  - stable shared interfaces available from in-flight roadmap work

