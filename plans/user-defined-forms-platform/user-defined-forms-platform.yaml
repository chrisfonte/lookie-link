answered_decisions:
  answered_by: review-fable.md section 7 (2026-07-15); working decisions recorded in plan.md, ratification in ADR issues
  answers:
    - {q: field grammar, a: constrained custom grammar with fixtures — no exposed JSON Schema subset, ratify: 93}
    - {q: repeatable groups, a: not in v1 — sessions deliver repeated entries as independent submissions, ratify: 93}
    - {q: minimal principal, a: 'multi-user contract from day one per operator direction 2026-07-15 — roadmap identity taxonomy, real per-principal permissions; v1 runtime = single-operator + agent tokens as one provider; signed receipts before a second user principal', ratify: 92}
    - {q: definition roots, a: mounted roots only behind a storage-adapter boundary, ratify: 93}
    - {q: event model + deletion, a: one file per submission + supersessions + delete-with-tombstone; ADR must distinguish application deletion from verified multi-peer/backup purging, ratify: 93}
    - {q: audit redaction, a: IDs/outcome classes/timestamps only — never values or titles, ratify: 92}
    - {q: CSRF posture, a: CSP-sandboxed /raw origin isolation load-bearing + Origin checks primary + tokens defense-in-depth + query tokens refused, ratify: 92}
    - {q: shared interfaces, a: merged-main only — temp+rename (hardened), safeResolve (+safe-create), canAccessPath seam, ratify: 92}
    - {q: issue decomposition, a: resolved by granular decomposition 105-134}
    - {q: direct imports, a: marked imports only; server-only attestation fields; provenance not security in single-operator mode, ratify: 93}

